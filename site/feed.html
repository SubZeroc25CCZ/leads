<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Private Feed — LeadMachine FL</title>
<style>
:root{--bg:#0b0d10;--panel:#14181d;--line:#232a31;--txt:#e8ebee;--dim:#8a94a0;--acc:#d4af37}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:15px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:0 22px 60px}
header{padding:24px 0;border-bottom:1px solid var(--line);margin-bottom:30px}
.logo{font-size:18px;letter-spacing:4px;font-weight:600}
.logo span{color:var(--acc)}
h1{font-size:24px;margin-bottom:4px}
.sub{color:var(--dim);margin-bottom:24px}
table{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--panel);border:1px solid var(--line)}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:1.5px;font-weight:500}
tr:last-child td{border-bottom:none}
.tag{display:inline-block;background:#0e1114;border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:11px;color:var(--dim);margin-right:3px}
.score{color:var(--acc);font-weight:700}
.twrap{overflow-x:auto;border-radius:10px;border:1px solid var(--line)}
.btn{display:inline-block;background:var(--acc);color:#0b0d10;font-weight:700;padding:11px 22px;border-radius:8px;text-decoration:none;font-size:14px;margin:20px 12px 0 0}
.btn2{display:inline-block;color:var(--txt);border:1px solid var(--line);padding:10px 18px;border-radius:8px;text-decoration:none;font-size:13.5px;margin-top:20px}
.err{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:30px;text-align:center;color:var(--dim)}
.meta{color:var(--dim);font-size:12.5px;margin-top:18px}
.meta code{background:var(--panel);padding:2px 7px;border-radius:5px;font-size:12px}
</style>
</head>
<body>
<header><div class="wrap" style="padding-bottom:0"><div class="logo">LEAD<span>MACHINE</span> FL — PRIVATE FEED</div></div></header>
<div class="wrap">
  <div id="app"><div class="err">Loading feed…</div></div>
</div>
<script>
const t = new URLSearchParams(location.search).get("t");
const app = document.getElementById("app");
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
if (!t || !/^[a-f0-9]{12}$/.test(t)) {
  app.innerHTML = '<div class="err">Missing or invalid access code. Check the link in your email, or contact <a style="color:var(--acc)" href="mailto:leadmachine@agentmail.to">leadmachine@agentmail.to</a>.</div>';
} else {
  fetch("/feed/" + t + ".json").then(r => { if (!r.ok) throw 0; return r.json(); }).then(d => {
    const rows = d.leads.map(l =>
      "<tr><td>"+esc(l.address)+"</td><td>"+esc(l.owner)+"</td><td>"+esc(l.city)+"</td><td>"+esc(l.zip)+"</td><td>"+l.signals.map(s=>'<span class="tag">'+esc(s)+"</span>").join("")+'</td><td class="score">'+l.score+"</td><td>"+esc(l.harvested)+"</td></tr>").join("");
    const csv = "address,owner,city,county,state,zip,score,signals,harvested\n" + d.leads.map(l =>
      [l.address,l.owner,l.city,d.county,"FL",l.zip,l.score,l.signals.join("|"),l.harvested].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\n");
    app.innerHTML =
      "<h1>Prepared for " + esc(d.prepared_for) + "</h1>" +
      '<div class="sub">' + d.leads.length + " scored leads · " + esc(d.county) + " County, FL · generated " + esc(d.generated) + "</div>" +
      '<div class="twrap"><table><thead><tr><th>Address</th><th>Owner</th><th>City</th><th>ZIP</th><th>Signals</th><th>Score</th><th>Harvested</th></tr></thead><tbody>' + rows + "</tbody></table></div>" +
      '<a class="btn" id="dl">Download CSV</a>' +
      '<a class="btn2" href="mailto:leadmachine@agentmail.to?subject=Full%20batch%20request%20(' + encodeURIComponent(d.prepared_for) + ')&body=Ready%20for%20the%20full%20batch.%20My%20target%20ZIPs%3A%20">Request the full county batch →</a>' +
      '<div class="meta">Programmatic access: <code>GET ' + location.origin + "/feed/" + t + '.json</code> — refreshed with each batch. Keep this link private. Use of this data is subject to the <a href="/terms.html" style="color:var(--acc)">Data License &amp; Terms</a>.</div>';
    const a = document.getElementById("dl");
    a.href = URL.createObjectURL(new Blob([csv], {type:"text/csv"}));
    a.download = "leadmachine_" + d.county.toLowerCase().replace(/[^a-z]/g,"") + "_sample.csv";
  }).catch(() => {
    app.innerHTML = '<div class="err">Feed not found for this code. Contact <a style="color:var(--acc)" href="mailto:leadmachine@agentmail.to">leadmachine@agentmail.to</a>.</div>';
  });
}
</script>
</body>
</html>
